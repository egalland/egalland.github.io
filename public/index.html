<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15131e">
<meta name="description" content="Explore Paris, la petite couronne et La Défense en laine avec tes amis, à pied ou au volant.">
<title>Maille City · Paris en laine</title>
<link rel="icon" href="/favicon.png">
<link rel="preload" href="/dm-serif.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/panels.css">
<link rel="modulepreload" href="/three.js">
<link rel="modulepreload" href="/three.core.min.js">
<link rel="modulepreload" href="/paris-data.js">
<link rel="stylesheet" href="/paris.css">
<script type="module" src="/entry.js"></script>
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="brand"><canvas id="brandMark" width="48" height="48" aria-hidden="true"></canvas><div><span class="brand-studio">KIKALMO</span><h1>Maille City</h1></div></div>
  <nav class="topnav" aria-label="Navigation du jeu">
    <button class="nav-current" id="playNav" aria-current="page"><i data-icon="gamepad"></i>Jouer</button>
    <button data-panel="map"><i data-icon="map"></i>Carte</button>
    <button data-panel="players"><i data-icon="people"></i>Joueurs</button>
  </nav>
  <div class="header-tools">
    <button class="online-chip" id="online" data-panel="players" title="Voir les joueurs connectés dans le monde" aria-label="Voir les joueurs connectés dans le monde"><b class="status-dot"></b><span id="onlineLabel">Connexion…</span></button>
    <span class="tool-divider"></span>
    <button class="tool" id="sound" aria-label="Activer le son" title="Activer le son"><i data-icon="volumeOff"></i></button>
    <button class="tool" data-panel="settings" aria-label="Réglages" title="Réglages"><i data-icon="settings"></i></button>
  </div>
</header>
<main class="scene" id="scene" aria-label="Ville jouable">
  <canvas id="city" tabindex="0" aria-label="Paris en laine, monde 3D à la troisième personne"></canvas>
  <div class="scene-shade" aria-hidden="true"></div>
  <section class="district" aria-label="Position actuelle">
    <div class="district-line"><i data-icon="pin"></i><span>PARIS · PETITE COURONNE</span></div>
    <h2 id="district">Place de l’Étoile</h2><span id="street" class="street"></span>
  </section>
  <section class="player-panel hud" aria-label="État du personnage">
    <div class="portrait"><canvas id="portrait" width="96" height="96" role="img" aria-label="Renard Kikalmo"></canvas></div>
    <div class="vitals">
      <div class="name-row"><strong id="playerName">Renard</strong><span class="you">VOUS</span></div>
      <div class="health-row"><i data-icon="heart"></i><div class="health-track"><div id="hpBar"></div></div><span id="hpNum">100</span></div>
      <div class="wanted" id="stars" aria-label="Aucune recherche"><span>★★★★★</span><div>★★★★★</div></div>
    </div>
  </section>
  <div id="driveHud" class="drive-hud" hidden><i data-icon="car"></i><span>Au volant</span><b id="carSpeed">0 km/h</b></div>
  <button id="sectorEdge" type="button" hidden></button>
  <div class="game-notice" id="notice" role="status" aria-live="polite"></div>
  <button class="hud radar" data-panel="map" title="Ouvrir la carte (M)" aria-label="Ouvrir la carte de la ville">
    <div class="radar-map"><canvas id="minimap" width="330" height="170"></canvas><span class="north">N</span><span class="radar-expand"><i data-icon="expand"></i></span></div>
    <div class="radar-cap"><span><i data-icon="radar"></i>MINI-CARTE</span><kbd>M</kbd></div>
  </button>
  <section class="inventory" aria-label="Équipement du joueur">
    <div class="inventory-cap"><span><i data-icon="pack"></i>ÉQUIPEMENT</span><span id="weaponLabel">Pistolet</span></div>
    <div class="inventory-slots" id="slots"></div>
  </section>
  <aside class="hud chat" id="chat" aria-label="Chat mondial">
    <button class="chat-head" id="chatToggle" aria-expanded="true"><span><i data-icon="chat"></i>Chat mondial</span><i data-icon="chevronDown"></i></button>
    <div class="chat-body"><div class="chat-log" id="chatLog" role="log" aria-live="polite"></div>
    <form id="chatForm"><input id="chatEntry" aria-label="Message pour le chat mondial" placeholder="Écrire un message…" autocomplete="off" enterkeyhint="send" maxlength="180"><button aria-label="Envoyer le message" title="Envoyer"><i data-icon="send"></i></button></form></div>
  </aside>
  <div id="touchControls" aria-label="Commandes tactiles">
    <div class="stick" id="stick" role="group" aria-label="Joystick de déplacement"><span></span><b></b></div>
    <div class="touch-actions"><button id="recenter" title="Recentrer la caméra" aria-label="Recentrer la caméra"><i data-icon="camera"></i></button><button id="ride" aria-label="Monter ou descendre du véhicule"><i data-icon="car"></i></button><button id="fire" aria-label="Utiliser l’arme"><i data-icon="aim"></i></button></div>
  </div>
  <div class="scene-load" id="loadScene" role="status"><div class="load-frame"><img src="/favicon.png" alt=""><strong>Maille City</strong><span id="loadingText">Ouverture de Paris en laine…</span><div class="load-progress"></div><button id="retryLoad" type="button" hidden>Réessayer</button><a id="returnToCity" hidden>Revenir avenue de la Grande Armée</a></div></div>
  <div id="panels"></div>
</main>
<footer class="keybar">
  <div class="keys-desktop">
    <span><kbd>ZQSD</kbd> Déplacer</span><span><kbd><i data-icon="mouse"></i></kbd> Tirer</span><span><kbd>E</kbd> Véhicule</span><span class="camera-key"><kbd>Clic droit</kbd> Caméra</span>
    <button data-panel="weapons"><kbd>TAB</kbd> Roue d’armes</button><button data-panel="emotes"><kbd>B</kbd> Émotes</button><button id="chatKey"><kbd>T</kbd> Chat</button>
  </div>
  <div class="keys-mobile"><button data-panel="weapons"><i data-icon="aim"></i>Armes</button><button data-panel="emotes"><i data-icon="smile"></i>Émotes</button><button data-panel="map"><i data-icon="map"></i>Carte</button><button id="chatMobile"><i data-icon="chat"></i>Chat</button></div>
  <button class="help" data-panel="help" title="Toutes les commandes"><i data-icon="help"></i><span>Commandes</span></button>
</footer>
</div>
</body>
</html>
