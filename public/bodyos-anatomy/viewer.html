<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BodyOS Anatomy Core</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body, #anatomy-root { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        background:
          linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px),
          radial-gradient(circle at 50% 42%, rgba(215,255,56,.045), transparent 48%),
          #090b09;
        background-size: 34px 34px, 34px 34px, auto, auto;
        font-family: "SFMono-Regular", Consolas, monospace;
      }
      canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      #anatomy-root::before {
        position: absolute;
        z-index: 2;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(90deg, rgba(255,255,255,.03), transparent 15%, transparent 85%, rgba(255,255,255,.03));
        content: "";
      }
      #anatomy-root::after {
        position: absolute;
        z-index: 3;
        top: -16%;
        left: 0;
        width: 100%;
        height: 16%;
        pointer-events: none;
        background: linear-gradient(transparent, rgba(215,255,56,.1), transparent);
        animation: scan 7s linear infinite;
        content: "";
      }
      @keyframes scan { to { transform: translateY(760%); } }
      #loading {
        position: absolute;
        z-index: 5;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 12px;
        background: rgba(9,11,9,.94);
        text-align: center;
        transition: opacity 260ms ease, visibility 260ms ease;
      }
      #loading.hidden { opacity: 0; visibility: hidden; }
      #loading strong { color: #d7ff38; font-size: 9px; letter-spacing: .18em; }
      #loading span { width: 190px; height: 2px; overflow: hidden; background: rgba(255,255,255,.1); }
      #loading span::after { display: block; width: 45%; height: 100%; background: #d7ff38; animation: load 1s ease-in-out infinite alternate; content: ""; }
      #loading small { color: rgba(255,255,255,.34); font-size: 7px; letter-spacing: .12em; }
      @keyframes load { to { transform: translateX(125%); } }
      #tooltip {
        position: absolute;
        z-index: 6;
        max-width: 220px;
        border: 1px solid rgba(215,255,56,.42);
        padding: 7px 9px;
        pointer-events: none;
        background: rgba(8,10,8,.92);
        color: #f4f1e8;
        font-size: 8px;
        line-height: 1.35;
        letter-spacing: .04em;
        opacity: 0;
        transform: translate(12px, 12px);
        transition: opacity 100ms ease;
        backdrop-filter: blur(10px);
      }
      #tooltip b { display: block; margin-top: 3px; color: #d7ff38; font-size: 7px; letter-spacing: .12em; text-transform: uppercase; }
      #error {
        position: absolute;
        z-index: 7;
        inset: 18px;
        display: none;
        place-content: center;
        gap: 10px;
        border: 1px solid rgba(255,102,94,.35);
        padding: 24px;
        background: rgba(20,9,8,.9);
        color: #ff665e;
        font-size: 9px;
        line-height: 1.6;
        text-align: center;
      }
      #error strong { color: #f4f1e8; font-size: 10px; letter-spacing: .15em; }
      #error span { max-width: 360px; color: rgba(244,241,232,.62); }
      #retry {
        justify-self: center;
        border: 1px solid rgba(215,255,56,.55);
        padding: 8px 14px;
        background: rgba(215,255,56,.08);
        color: #d7ff38;
        font: inherit;
        font-weight: 700;
        letter-spacing: .14em;
        cursor: pointer;
      }
      #retry:hover { background: #d7ff38; color: #090b09; }
      @media (prefers-reduced-motion: reduce) {
        #anatomy-root::after, #loading span::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="anatomy-root" aria-label="Modèle anatomique musculaire interactif"></div>
    <div id="loading" role="status">
      <strong>ANATOMY CORE // CHARGEMENT</strong>
      <span></span>
      <small>MODÈLE MUSCULAIRE HAUTE PRÉCISION</small>
    </div>
    <div id="tooltip" role="tooltip"></div>
    <div id="error" role="alert">
      <strong>MODÈLE 3D INDISPONIBLE</strong>
      <span id="error-detail">La liste musculaire reste disponible sous le modèle.</span>
      <button id="retry" type="button">RÉESSAYER</button>
    </div>
    <script src="./boot.js?v=5"></script>
    <script type="module" src="./viewer.js?v=5"></script>
  </body>
</html>
