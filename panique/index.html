<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101114"><title>PANIQUE — le bouton rouge</title>
<style>
:root{color-scheme:dark;--red:#f43e3e;--ink:#101114;--muted:#8c8d95;--cream:#eee9df;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--mono)}body{background:var(--ink);color:var(--cream);overflow-x:hidden}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #fff;outline-offset:7px}#room{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;position:relative;background:radial-gradient(ellipse at 50% 43%,#292a30 0,transparent 60%),repeating-linear-gradient(0deg,transparent 0 79px,#ffffff03 79px 80px),repeating-linear-gradient(90deg,transparent 0 79px,#ffffff03 79px 80px);transition:filter .4s}header,footer{display:flex;align-items:center;justify-content:space-between;padding:28px 36px;gap:16px;position:relative;z-index:30}.brand{letter-spacing:.15em;font-weight:bold;font-size:13px}.brand i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:10px}.edition{font-size:10px;letter-spacing:.12em;color:var(--muted)}main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:38px 20px 60px;position:relative;z-index:2}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.3em;color:var(--muted);margin:0 0 44px}.assembly{position:relative;width:min(300px,73vw);aspect-ratio:1;border-radius:50%;background:linear-gradient(145deg,#44454c,#1b1c21 50%,#34353b);padding:22px;box-shadow:0 28px 65px #0009,inset 0 1px 2px #fff4,inset 0 -2px 4px #0009;border:1px solid #46474c}.assembly:before{content:"";position:absolute;inset:12px;border-radius:50%;border:1px solid #08090b;box-shadow:0 1px 0 #ffffff12}.screw{position:absolute;width:9px;height:9px;background:#777981;border-radius:50%;box-shadow:0 1px 2px #000}.screw:after{content:"";position:absolute;top:4px;left:1px;width:7px;height:1px;background:#25262b;transform:rotate(-35deg)}.screw:nth-child(1){top:24px;left:62px}.screw:nth-child(2){top:24px;right:62px}.screw:nth-child(3){bottom:24px;left:62px}.screw:nth-child(4){bottom:24px;right:62px}#panic{position:relative;width:100%;height:100%;border:1px solid #ff7972;border-radius:50%;color:#ffe7df;background:radial-gradient(ellipse at 40% 22%,#ff6a58 0,#ec3432 47%,#ba121b 100%);box-shadow:0 13px 0 #750a14,0 18px 16px #0008,inset 0 4px 8px #ffb89b55,inset 0 -7px 15px #76030e66;text-shadow:0 2px 1px #750a1466;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px}#panic:hover{filter:brightness(1.06)}#panic:active{transform:translateY(9px);box-shadow:0 4px 0 #750a14,0 7px 9px #0008,inset 0 2px 5px #ffb89b44}#panic strong{font-family:Arial,sans-serif;font-weight:900;font-size:clamp(28px,8vw,43px);letter-spacing:.035em}#panic small{font-size:10px;letter-spacing:.2em;opacity:.7}.caption{margin:48px 0 0;color:#b7b5b4;font-size:12px;letter-spacing:.05em;text-align:center;line-height:1.8}.caption span{color:#75747d;font-size:10px}.controls{display:flex;gap:10px}.quiet{border:1px solid #3a3b42;color:#a7a7af;background:#ffffff04;padding:10px 13px;border-radius:7px;font-size:10px}.quiet:hover{background:#ffffff0c;color:white}footer{font-size:10px;color:#777881}.footnote{line-height:1.6}.counter{color:#bbb8b3}.sr{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}#fx{position:fixed;inset:0;z-index:10;pointer-events:none;overflow:hidden}.window{pointer-events:auto;position:absolute;width:min(340px,calc(100vw - 28px));border:1px solid #565760;border-radius:11px;background:#202127;box-shadow:0 22px 70px #0009;animation:enter .25s ease-out}.bar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #3b3c43;padding:10px 14px;font-size:10px;letter-spacing:.08em;color:#a1a1aa}.close{background:none;border:0;color:#b4b4bd;font-size:19px;padding:0 4px;line-height:1}.window-body{padding:21px}.window h2{font-family:Arial,sans-serif;font-size:22px;letter-spacing:-.035em;margin:0 0 12px}.window p{font-size:11px;line-height:1.8;color:#b9b9c4;margin:0 0 18px}.window .action{background:#efe9df;color:#191a1e;border:0;border-radius:5px;padding:10px 15px;font-size:10px}.window.red{border-color:#943837}.window.red .bar{color:#ff8074}.toast{position:absolute;right:22px;bottom:100px;pointer-events:auto;background:#e9e4da;color:#232327;padding:18px 20px;border-radius:12px;width:min(340px,calc(100vw - 44px));box-shadow:0 12px 35px #0008;animation:enter .25s ease-out}.toast b{display:block;font-size:12px;margin:6px 0}.toast p{font-size:11px;line-height:1.7;margin:0}.toast small{font-size:9px;letter-spacing:.1em;color:#74716d}.toast .close{float:right;color:#666}.crack{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(1px 1px 1px #000);opacity:.8}.crack path{fill:none;stroke:#d3e3ef;stroke-width:1.2;vector-effect:non-scaling-stroke}.huge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Arial,sans-serif;font-size:clamp(42px,12vw,130px);font-weight:900;letter-spacing:-.07em;line-height:.95;background:#17181cdd;color:#e6e3da;padding:20px}.huge small{font:10px var(--mono);display:block;letter-spacing:.12em;line-height:2;margin-top:24px}.blackout{background:#050505;color:#747477}.paper{position:absolute;inset:0;background:#ece6d9;color:#222;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px}.paper h2{font-family:Georgia,serif;font-size:clamp(35px,9vw,85px);font-weight:normal;font-style:italic;margin:0}.paper p{font-size:12px}.orb{width:110px;height:110px;position:absolute;background:#f4423c;border:1px solid #ff9881;border-radius:50%;box-shadow:inset -15px -18px 25px #980e17,0 12px 30px #0006;animation:float 3s ease-in-out infinite alternate}.cursor-ghost{position:absolute;font-size:31px;color:#eee;transform:rotate(-35deg);text-shadow:2px 2px #000}.rain{position:absolute;top:-35px;font-size:24px;animation:fall 4s linear forwards}.tape{position:absolute;left:-10%;width:120%;background:#eedb65;color:#161616;font-size:13px;font-weight:bold;text-align:center;letter-spacing:.15em;line-height:48px;transform:rotate(-7deg)}.invert{filter:invert(1) hue-rotate(155deg)}.tilt{transform:rotate(2deg) scale(.98);border-radius:22px;outline:1px solid #46474c}.glitch{animation:glitch 1.5s steps(1) 2}.loading{height:7px;background:#0e0f12;border-radius:5px;overflow:hidden;margin:20px 0 12px}.loading div{height:100%;background:#f35149;animation:load 6s ease-out forwards}.percent{color:#f88b7e;font-size:10px}.stamp{position:absolute;left:50%;top:20%;transform:translateX(-50%) rotate(-12deg);border:4px solid #ef645b;border-radius:8px;padding:14px 25px;color:#ef645b;text-align:center;font-size:clamp(20px,6vw,42px);font-weight:bold;letter-spacing:.08em;background:#111c}.stamp small{display:block;font-size:10px;letter-spacing:.2em}.error-line{font-size:11px;color:#88ae91;margin:7px 0}.terminal{background:#101713}.terminal h2{color:#98b69e}@keyframes enter{from{transform:translateY(14px) scale(.95);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}@keyframes glitch{0%,100%{transform:none}20%{transform:translate(8px,-2px);filter:sepia(.8)}25%{transform:none}58%{transform:translate(-8px,3px)}60%{transform:none}83%{filter:hue-rotate(100deg)}}@keyframes float{to{transform:translate(15px,-30px) rotate(15deg)}}@keyframes fall{to{transform:translateY(110vh) rotate(260deg)}}@keyframes load{from{width:3%}to{width:99%}}@media(max-width:540px){header,footer{padding:21px 20px}.edition{font-size:8px}.eyebrow{margin-bottom:36px}main{padding-bottom:38px}footer{align-items:flex-end;gap:10px}.controls{gap:6px}.quiet{padding:10px}.footnote{max-width:140px;font-size:9px}.caption{margin-top:43px}.window h2{font-size:21px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.glitch{filter:sepia(.6)}.rain{top:40%}.orb{transform:none}.loading div{width:99%}}
</style></head><body>
<div id="room"><header><div class="brand"><i></i>PANIQUE</div><div class="edition">INKTOBER · 07 / 31 · V1.0</div></header>
<main><p class="eyebrow">Tout est sous contrôle.</p><div class="assembly"><i class="screw"></i><i class="screw"></i><i class="screw"></i><i class="screw"></i><button id="panic" aria-label="Panique : déclencher une surprise aléatoire"><strong>PANIQUE</strong><small>APPUIE. OU PAS.</small></button></div><p class="caption">Qu’est-ce qui pourrait mal se passer ?<br><span>Un bouton. Aucune garantie.</span></p></main>
<footer><div class="footnote">Simulation absurde, effets dans la page.<br><span class="counter">0 pression</span></div><div class="controls"><button id="sound" class="quiet" aria-pressed="false">Son : off</button><button id="reset" class="quiet" title="Tout remettre à zéro (Échap)">Réinitialiser · Esc</button></div></footer></div>
<div id="fx" aria-label="Effets de simulation"></div><div id="announcement" class="sr" role="status" aria-live="polite"></div>
<script>
'use strict';
const room=document.querySelector('#room'),fx=document.querySelector('#fx'),panic=document.querySelector('#panic'),announcement=document.querySelector('#announcement'),soundButton=document.querySelector('#sound');
let count=0,last=-1,timers=new Set(),audioContext=null,sound=false;
try{sound=localStorage.getItem('panique-sound')==='true'}catch(e){}
function soundLabel(){soundButton.textContent='Son : '+(sound?'on':'off');soundButton.setAttribute('aria-pressed',String(sound))}soundLabel();
function later(fn,ms){const id=setTimeout(()=>{timers.delete(id);fn()},ms);timers.add(id);return id}
function announce(text){announcement.textContent=text}
function node(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text)n.textContent=text;return n}
function add(n){while(fx.children.length>=32)fx.firstElementChild.remove();fx.append(n);return n}
function clearEffects(focus=false){for(const t of timers)clearTimeout(t);timers.clear();fx.replaceChildren();room.classList.remove('glitch','invert','tilt');room.style.transform='';if(focus)panic.focus()}
function reset(){clearEffects(true);count=0;last=-1;document.querySelector('.counter').textContent='0 pression';announce('Tout est remis à zéro. Le bouton est prêt.')}
function beep(){if(!sound)return;try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.setValueAtTime(160,audioContext.currentTime);o.frequency.exponentialRampToValueAtTime(70,audioContext.currentTime+.16);g.gain.setValueAtTime(.045,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.2);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.22)}catch(e){sound=false;soundLabel()}}
function position(n,i=0){const w=Math.min(340,innerWidth-28),h=250;const maxX=Math.max(14,innerWidth-w-14),maxY=Math.max(90,innerHeight-h-90);n.style.left=Math.round(14+Math.random()*Math.max(0,maxX-14))+'px';n.style.top=Math.round(75+Math.random()*Math.max(0,maxY-75))+'px'}
function win(title,body,button='D’accord, je suppose.',cls='red'){const n=node('section','window '+cls);n.setAttribute('aria-label',title);const bar=node('div','bar','INCIDENT IMAGINAIRE');const close=node('button','close','×');close.setAttribute('aria-label','Fermer cette fenêtre');close.onclick=()=>n.remove();bar.append(close);const b=node('div','window-body');b.append(node('h2','',title),node('p','',body));const action=node('button','action',button);action.onclick=()=>{n.remove();panic.focus()};b.append(action);n.append(bar,b);position(n);return add(n)}
function toast(title,text){const n=node('div','toast');const close=node('button','close','×');close.setAttribute('aria-label','Fermer la notification fictive');close.onclick=()=>n.remove();n.append(close,node('small','','NOTIFICATION FICTIVE'),node('b','',title),node('p','',text));add(n);later(()=>n.remove(),6500)}
function huge(text,sub,cls=''){const n=node('div','huge '+cls),box=node('div');box.append(node('div','',text),node('small','',sub));n.append(box);add(n)}
const scenarios=[
{name:'Absolument rien',run(){/* Même pas un message. */}},
{name:'Écran fissuré',run(){const n=document.createElementNS('http://www.w3.org/2000/svg','svg');n.setAttribute('class','crack');n.setAttribute('viewBox','0 0 1000 800');n.setAttribute('preserveAspectRatio','none');for(const d of ['M620 320 L551 272 527 190 460 153 424 0','M620 320 L751 246 809 180 1000 114','M620 320 L762 389 812 482 1000 510','M620 320 L556 473 601 561 545 800','M620 320 L395 354 301 439 138 460 0 599','M527 190 L623 166 670 77','M751 246 L760 322 867 352','M556 473 L460 543 455 643','M395 354 L354 248 205 206 167 88','M301 439 L273 562 166 607']){const p=document.createElementNS(n.namespaceURI,'path');p.setAttribute('d',d);n.append(p)}add(n);toast('Ça se répare avec un clic.','Échap remet les morceaux en place.')}},
{name:'Erreur existentielle',run(){win('Erreur 418 : le bouton doute.','Votre pression a été prise personnellement. Le bouton demande cinq minutes pour réfléchir à sa carrière.','Respecter son choix')}},
{name:'Notification improbable',run(){toast('La Lune vous a mis en sourdine.','Motif : trop de clics. Durée estimée : une petite éternité.')}},
{name:'Avalanche administrative',run(){const titles=['Demande de panique reçue.','Autorisation de paniquer manquante.','Votre calme a expiré.','Une fenêtre ouvre une enquête.','Réunion de crise annulée.','Merci de ne pas lire ce message.'];titles.forEach((t,i)=>later(()=>win(t,'Ce message n’a aucune conséquence. Mais il avait très envie d’apparaître.','Classer sans suite'),i*220))}},
{name:'Dérèglement graphique',run(){room.classList.add('glitch');later(()=>room.classList.remove('glitch'),3200);toast('La réalité a légèrement glissé.','Nous avons remis le curseur « normal » sur « presque ».')}},
{name:'Mise à jour du rien',run(){const n=win('Installation du néant.','Veuillez patienter pendant que nous ne changeons absolument rien.','Annuler le rien');const b=n.querySelector('.window-body'),track=node('div','loading'),fill=node('div');track.append(fill);b.insertBefore(track,b.lastChild);const label=node('div','percent','99 % — il reste environ jamais.');b.insertBefore(label,b.lastChild)}},
{name:'Silence dramatique',run(){huge('…','Le silence aussi peut être suspect.','blackout');later(()=>clearEffects(),4200)}},
{name:'Compte à rebours inutile',run(){huge('5','Événement absolument sans importance en préparation.');let k=5;function tick(){k--;const t=fx.querySelector('.huge > div > div');if(!t)return;if(k>0){t.textContent=String(k);later(tick,850)}else{clearEffects();toast('Rien n’a eu lieu.','À l’heure prévue. Une organisation exemplaire.')}}later(tick,850)}},
{name:'Boutons sauvages',run(){for(let i=0;i<9;i++){const n=node('div','orb');n.style.left=(5+Math.random()*80)+'%';n.style.top=(15+Math.random()*60)+'%';n.style.width=n.style.height=(25+Math.random()*70)+'px';n.style.animationDelay=(-Math.random()*3)+'s';add(n)}toast('Le bouton s’est reproduit.','Ils sont tous décoratifs. Ne les nourrissez pas après minuit.')}},
{name:'Changement de dimension',run(){room.classList.add('invert','tilt');toast('Vous êtes passé de l’autre côté.','C’est la même page, mais elle a un avis différent.')}},
{name:'Pluie de dossiers',run(){for(let i=0;i<22;i++){const n=node('div','rain',i%3?'📁':'🧾');n.style.left=(Math.random()*94)+'%';n.style.animationDelay=(Math.random()*1.5)+'s';add(n)}toast('Vos dossiers imaginaires tombent.','Personne n’était chargé de les ranger.')}},
{name:'Zone de panique',run(){for(let i=0;i<3;i++){const n=node('div','tape','ZONE DE PANIQUE · NE PAS PRENDRE AU SÉRIEUX · ZONE DE PANIQUE');n.style.top=(20+i*27)+'%';n.style.transform='rotate('+(i%2?7:-7)+'deg)';add(n)}}},
{name:'Mode tragédie',run(){const n=node('div','paper'),b=node('div');b.append(node('p','','COMMUNIQUÉ NON OFFICIEL'),node('h2','','Tout allait si bien.'),node('p','','Puis quelqu’un a appuyé sur le bouton.'));n.append(b);add(n);later(()=>clearEffects(),6000)}},
{name:'Curseurs en réunion',run(){for(let i=0;i<17;i++){const n=node('div','cursor-ghost','➤');n.style.left=(5+Math.random()*88)+'%';n.style.top=(12+Math.random()*69)+'%';add(n)}toast('17 curseurs vous observent.','Ils attendent que vous fassiez quelque chose d’intéressant.')}},
{name:'Diagnostic absurde',run(){const n=win('Diagnostic terminé.','Bilan : aucune catastrophe détectée. C’est presque décevant.','Continuer à faire semblant','terminal');const b=n.querySelector('.window-body');['✓ Gravité : toujours vers le bas','✓ Café : théoriquement possible','! Bon sens : facultatif'].forEach(t=>b.insertBefore(node('div','error-line',t),b.lastChild))}},
{name:'Certification de panique',run(){const n=node('div','stamp','PANIQUE VALIDÉE');n.append(node('small','','PAR ABSOLUMENT PERSONNE'));add(n);toast('Félicitations, vous avez paniqué.','Ce certificat n’a aucune valeur. Gardez-le précieusement.')}}
];
function trigger(forcedIndex){clearEffects();count++;document.querySelector('.counter').textContent=count+' pression'+(count>1?'s':'');let idx=Number.isInteger(forcedIndex)?forcedIndex:Math.floor(Math.random()*scenarios.length);if(!Number.isInteger(forcedIndex)&&idx===last)idx=(idx+1)%scenarios.length;last=idx;beep();const s=scenarios[idx];s.run();announce(s.name==='Absolument rien'?'':s.name+'. Simulation dans la page. Échap pour remettre à zéro.');later(()=>clearEffects(),16000)}
panic.addEventListener('click',()=>trigger());document.querySelector('#reset').addEventListener('click',reset);document.addEventListener('keydown',e=>{if(e.key==='Escape')reset()});soundButton.addEventListener('click',()=>{sound=!sound;soundLabel();try{localStorage.setItem('panique-sound',String(sound))}catch(e){}if(sound)beep()});
</script></body></html>
