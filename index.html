<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier Horizons 3D</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Atelier Horizons 3D</h1><p>Modifiez les hypothèses de cet atelier fictif pour suivre son chiffre d’affaires, son bénéfice et sa trésorerie année par année.</p><form><fieldset><legend>Hypothèses</legend><div class="fields"><label>Horizon (années)<input required type="number" name="horizon" value="5" min="1" max="60" step="1"></label><label>Apport initial (€)<input required type="number" name="initialCapital" value="1200" min="0" max="1000000" step="1"></label><label>Machines au départ<input required type="number" name="initialMachines" value="1" min="0" max="20" step="1"></label><label>Temps disponible (h/mois)<input required type="number" name="ownerHours" value="50" min="0" max="250" step="1"></label><label>Scénario<select name="scenario"><option value="prudent">Prudent</option><option value="central" selected>Central</option><option value="soutenu">Soutenu</option></select></label></div></fieldset><button type="submit">Calculer la projection</button></form><p role="alert" id="error"></p><section aria-live="polite" aria-atomic="true"><h2>Projection</h2><div id="output"></div></section><noscript>Activez JavaScript pour utiliser les calculs interactifs.</noscript></main><script type="module" src="web.mjs"></script></body></html>
