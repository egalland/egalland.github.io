<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bilan de code</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Bilan de code</h1><p>Estimez une journée fictive de développement. Le modèle valorise le temps assisté à 35 €/h et l’équivalent développeur à 40 €/h.</p><form><fieldset><legend>Activité du jour</legend><div class="fields"><label>Temps IA minimum (min)<input required type="number" name="vmin" value="30" min="0" max="1000000" step="1"></label><label>Temps IA maximum (min)<input required type="number" name="vmax" value="60" min="0" max="1000000" step="1"></label><label>Équivalent dev. minimum (h)<input required type="number" name="dmin" value="2" min="0" max="1000000" step="0.1"></label><label>Équivalent dev. maximum (h)<input required type="number" name="dmax" value="3" min="0" max="1000000" step="0.1"></label><label>Lignes ajoutées<input required type="number" name="added" value="20" min="0" max="1000000" step="1"></label><label>Lignes supprimées<input required type="number" name="deleted" value="7" min="0" max="1000000" step="1"></label></div></fieldset><button type="submit">Calculer le bilan</button></form><p role="alert" id="error"></p><section aria-live="polite" aria-atomic="true"><h2>Bilan de la journée</h2><div id="output"></div></section><noscript>Activez JavaScript pour utiliser les calculs interactifs.</noscript></main><script type="module" src="web.mjs"></script></body></html>
