<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>MX Master 3 — Jiggler optique</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column}
  #wrap{position:relative;flex:1;min-height:0;background:#000}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000}
  #target{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(68vw,300px);height:min(44vw,190px);
    border:2px solid rgba(255,255,255,.78);border-radius:26px;
    pointer-events:none;box-shadow:0 0 0 2px rgba(0,0,0,.55) inset
  }
  #target:after{
    content:"CAPTEUR";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-size:11px;letter-spacing:.14em;background:rgba(0,0,0,.72);padding:5px 8px;border-radius:999px
  }
  #ui{padding:10px;background:#111;border-top:1px solid #333;display:grid;gap:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button,select,input{font:inherit}
  button,select{min-height:42px;border-radius:10px;border:1px solid #444;background:#222;color:#fff;padding:0 12px}
  button.primary{background:#fff;color:#000;border-color:#fff;font-weight:700}
  label{font-size:13px;color:#ddd}
  input[type=range]{width:100%}
  #info{font-size:12px;color:#bbb;line-height:1.35}
  .hide-ui #ui,.hide-ui #target{display:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="target"></div>
</div>

<div id="ui">
  <div class="row">
    <button id="toggle" class="primary">Pause</button>
    <button id="fs">Plein écran</button>
    <button id="hide">Masquer interface</button>
    <select id="mode">
      <option value="noise">Bruit fin — recommandé</option>
      <option value="checker">Damier mobile</option>
      <option value="stripes">Rayures mobiles</option>
      <option value="combo">Combo agressif</option>
    </select>
  </div>
  <div>
    <label for="speed">Vitesse : <span id="sv">60</span></label>
    <input id="speed" type="range" min="10" max="180" value="60">
  </div>
  <div>
    <label for="size">Taille du motif : <span id="zs">3 px</span></label>
    <input id="size" type="range" min="2" max="10" value="3">
  </div>
  <div id="info">
    Pose le capteur au centre. Commence par « Bruit fin ». Si rien ne se passe, monte la vitesse puis teste « Combo agressif ».
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha:false });
  const toggle = document.getElementById('toggle');
  const fs = document.getElementById('fs');
  const hide = document.getElementById('hide');
  const mode = document.getElementById('mode');
  const speed = document.getElementById('speed');
  const size = document.getElementById('size');
  const sv = document.getElementById('sv');
  const zs = document.getElementById('zs');

  let running = true, raf = 0, last = performance.now();
  let ox = 0, oy = 0, t = 0, noiseCanvas = null, noiseCtx = null;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    buildNoise();
  }

  function buildNoise() {
    const cell = Number(size.value);
    const w = 360, h = 360;
    noiseCanvas = document.createElement('canvas');
    noiseCanvas.width = w; noiseCanvas.height = h;
    noiseCtx = noiseCanvas.getContext('2d', {alpha:false});
    noiseCtx.fillStyle = '#000';
    noiseCtx.fillRect(0,0,w,h);

    for(let y=0;y<h;y+=cell){
      for(let x=0;x<w;x+=cell){
        noiseCtx.fillStyle = Math.random() > .5 ? '#fff' : '#000';
        noiseCtx.fillRect(x,y,cell,cell);
      }
    }
  }

  function drawNoise(w,h) {
    const pat = ctx.createPattern(noiseCanvas,'repeat');
    ctx.save();
    ctx.translate(ox,oy);
    ctx.fillStyle = pat;
    ctx.fillRect(-400,-400,w+800,h+800);
    ctx.restore();
  }

  function drawChecker(w,h) {
    const s = Math.max(4, Number(size.value)*2);
    ctx.save();
    ctx.translate(ox,oy);
    for(let y=-s*4;y<h+s*4;y+=s){
      for(let x=-s*4;x<w+s*4;x+=s){
        ctx.fillStyle = (((x/s|0)+(y/s|0)) & 1) ? '#fff' : '#000';
        ctx.fillRect(x,y,s,s);
      }
    }
    ctx.restore();
  }

  function drawStripes(w,h) {
    const s = Math.max(3, Number(size.value));
    ctx.save();
    ctx.translate(ox,oy);
    ctx.rotate(-0.35);
    for(let x=-h;x<w+h;x+=s*2){
      ctx.fillStyle='#fff';
      ctx.fillRect(x,-h,s,h*3);
    }
    ctx.restore();
  }

  function frame(now){
    if(!running) return;
    const dt = Math.min(.05,(now-last)/1000);
    last = now;
    t += dt;
    const v = Number(speed.value);
    const w = canvas.clientWidth, h = canvas.clientHeight;

    ox = (ox + v*dt) % 360;
    oy = (oy + v*.63*dt) % 360;

    ctx.fillStyle='#000';
    ctx.fillRect(0,0,w,h);

    if(mode.value==='noise') drawNoise(w,h);
    if(mode.value==='checker') drawChecker(w,h);
    if(mode.value==='stripes') drawStripes(w,h);
    if(mode.value==='combo'){
      drawNoise(w,h);
      ctx.globalCompositeOperation='difference';
      drawStripes(w,h);
      ctx.globalCompositeOperation='source-over';
    }

    raf = requestAnimationFrame(frame);
  }

  function start(){
    if(running) return;
    running=true; toggle.textContent='Pause'; last=performance.now();
    raf=requestAnimationFrame(frame);
  }
  function stop(){
    running=false; toggle.textContent='Démarrer'; cancelAnimationFrame(raf);
  }

  toggle.addEventListener('click',()=>running?stop():start());
  fs.addEventListener('click',async()=>{
    try{
      if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    }catch(e){}
  });
  hide.addEventListener('click',()=>document.body.classList.toggle('hide-ui'));
  canvas.addEventListener('dblclick',()=>document.body.classList.toggle('hide-ui'));

  speed.addEventListener('input',()=>sv.textContent=speed.value);
  size.addEventListener('input',()=>{zs.textContent=size.value+' px';buildNoise();});
  mode.addEventListener('change',()=>{ox=0;oy=0;});

  window.addEventListener('resize',resize);

  async function wake(){
    try{
      if('wakeLock' in navigator) await navigator.wakeLock.request('screen');
    }catch(e){}
  }
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake();});

  resize(); wake(); raf=requestAnimationFrame(frame);
})();
</script>
</body>
</html>
