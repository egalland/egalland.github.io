<!doctype html>
<html lang="fr" data-theme="points">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eeeae3">
  <meta name="description" content="{{metaDescription}}">
  <title>Emmanuel Galland — Projets en points</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23eeece5'/%3E%3Ccircle cx='32' cy='32' r='21' fill='%23f23625'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts.css" as="style">
  <link rel="stylesheet" href="style.css?v=workshop1">
</head>
<body>
  <a class="skip" href="#market-plus">Aller aux projets</a>
  <header class="header">
    <a class="identity" href="/" aria-label="Emmanuel Galland, choisir une vue"><span class="monogram">eg<span>●</span></span><span>EMMANUEL<br> GALLAND</span></a>

    <div class="header-actions"><div class="theme-switch" role="group" aria-label="Thème visuel"><button type="button" aria-pressed="true">Points</button><a data-view-switch href="/?theme=curseurs" role="button" aria-pressed="false">Curseurs</a></div><a class="contact-shortcut" href="#contact">LIENS <span>↗</span></a><button id="projectsButton" aria-expanded="false" aria-controls="projectMenu">LES PROJETS <span class="menu-mark" aria-hidden="true">＋</span></button></div>
  </header>

  <div id="scene" aria-hidden="true"><canvas id="particles"></canvas><div class="scene-grid"></div><div class="stage-label"><span class="signal"></span><span id="formationLabel">MATIÈRE EN DEVENIR</span></div><div class="coordinates"><span id="sceneNumber">00</span><span>FORME / MOUVEMENT</span><span class="cross">+</span></div></div>
  <div id="cursor" aria-hidden="true"><span class="cursor-dot"></span><span class="cursor-ring"></span><span class="cursor-hint">MAINTENIR POUR ATTIRER</span><i class="cursor-flash"></i></div>
  <svg class="svg-defs" aria-hidden="true"><filter id="liquid-type" x="-20%" y="-35%" width="140%" height="175%"><feTurbulence type="fractalNoise" baseFrequency=".008 .025" numOctaves="2" seed="7" result="noise"/><feDisplacementMap id="typeDisplacement" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
  <div class="pointer-ripple" aria-hidden="true"></div>
  <main>
{{chaptersHtml}}
</main>

  {{dockHtml}}
  <div class="navigation-hint mono"><span class="mini-mouse" aria-hidden="true"></span><span class="desktop-help">CLIC GAUCHE : ATTIRER <i>·</i> CLIC DROIT : PROJETS</span><span class="mobile-help">TOUCHER POUR ATTIRER</span></div>
  <div class="page-progress" aria-hidden="true"><span id="progressFill"></span></div>
  <div class="page-counter mono" aria-hidden="true"><span id="currentFrame">00</span><span>/ 18</span></div>
  <div class="frame-navigation"><button id="previousFrame" aria-label="Tableau précédent">←</button><span id="stepLabel" class="mono">LE DÉPART</span><button id="nextFrame" aria-label="Tableau suivant">→</button></div>
  {{menuHtml}}
  <div id="interactionStatus" class="sr-only" role="status" aria-live="polite"></div>
  <noscript><style>.chapter,.chapter.intro,.chapter.outro{position:relative!important;visibility:visible!important;opacity:1!important;height:auto!important;overflow:visible!important}.panel{position:relative!important;min-height:90svh;height:auto!important;padding:110px 5vw!important}.copy{max-width:100%!important;pointer-events:auto!important;opacity:1!important}.project-dock,.frame-navigation,.navigation-hint,#scene{display:none!important}</style><div class="noscript">Les descriptions et liens restent accessibles. Activez JavaScript pour explorer les formations interactives.</div></noscript>
  <script type="module" src="app.js?v=workshop1"></script>
</body>
</html>
